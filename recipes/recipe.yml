# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: auraos-main
description: For Everyone

base-image: ghcr.io/ublue-os/kinoite-main
image-version: 43

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    install:
      - vlc
      - distrobox
      - git
      - fastfetch
    remove:
      - firefox
      - firefox-langpacks

  - type: bling
    install:
      - rpmfusion

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
      - scope: user

  - type: signing
