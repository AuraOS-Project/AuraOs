# yaml-language-server: $schema=https://schema.blue-build.org/recipe-v1.json
name: auraos-nvidia
description: Nvidia sürücüleri optimize edilmiş, herkes için bozulmaz ve modern omnirole Linux dağıtımı.

base-image: ghcr.io/ublue-os/kinoite-nvidia
image-version: 40

modules:
  - type: files
    files:
      - source: system
        destination: /

  - type: rpm-ostree
    install:
      - vlc
      - distrobox
      - boxbuddy
      - git
      - fastfetch
    remove:
      - firefox
      - firefox-langpacks

  - type: blinky

  - type: default-flatpaks
    configurations:
      - notify: true
        scope: system
        install:
          - org.mozilla.firefox
          - org.kde.discover
      - scope: user

  - type: signing
